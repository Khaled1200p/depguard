name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Go Baseline Generator
        run: |
          go mod tidy
          go vet ./...
          make gen

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev

      - name: Build eBPF Sensor
        run: make sensor          # go mod tidy -> go generate (bpf2go) -> go build

      - name: Run Full Attack Simulation (Tier A, expects 12/12)
        run: ./test/attack_simulation.sh

      - name: eBPF Tier B as root
        run: |
          sudo -E env "PATH=$PATH" DEPGUARD_GEN="$PWD/bin/depguard-gen" \
            ./test/attack_simulation.sh
